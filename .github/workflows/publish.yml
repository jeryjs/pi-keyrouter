name: Publish

# Publishing is driven by a version tag, not by main. Combined with Trusted
# Publishing (see below) this means npm never sees a long-lived secret: the
# workflow authenticates over OIDC using its own short-lived identity token.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Gate the publish on a green typecheck. A broken release should fail here
    # rather than after the version is immutable on the registry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # No registry-url here: this job only typechecks, it never publishes, so
          # it has no use for npm auth.
          package-manager-cache: false
      - run: npm ci
      # npm's own script shells out to `bun`, which is not on the runner, so
      # invoke tsc directly here. Without the install above, `npx tsc` resolves
      # the deprecated `tsc` stub on the registry rather than TypeScript.
      - run: npx tsc --noEmit -p tsconfig.json
      # The tag is the release version. Publishing a mismatched version would
      # burn the tag, because npm versions are immutable.
      #
      # Tag refs only: a workflow_dispatch runs from a branch, where ref_name is
      # "main" and there is no version to compare against.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME is v$TAG but package.json is $VERSION"
            exit 1
          fi

  publish:
    needs: verify
    # A branch carries no version, and publishing from one would burn an
    # immutable version number against whatever happens to be on main. Tags are
    # the only release path; workflow_dispatch exists to exercise `verify`.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Required: this mints the OIDC token npm exchanges for publish rights.
      # Scoped to this job only.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
          # setup-node's "24" resolves to a current 24.x, comfortably clear of
          # both floors rather than relying on an unpinned minor.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Provenance is generated automatically when publishing via Trusted
      # Publishing, so the flag is belt-and-braces rather than required.
      - run: npm publish --provenance --access public
